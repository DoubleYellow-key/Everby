name: Verify desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: dist:mac:arm64
          - os: macos-13
            command: dist:mac:x64
          - os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r agent/requirements-build.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:test
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ${{ matrix.command }}
